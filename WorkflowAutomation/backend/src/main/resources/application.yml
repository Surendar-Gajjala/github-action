server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: onboarding-backend
  datasource:
    # Default: file-based H2 in PostgreSQL compatibility mode. Use the "postgres" profile for PostgreSQL.
    url: ${DATABASE_URL:jdbc:h2:file:./data/onboarding;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/sample
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}] [wf=%X{workflowId:-}]"
  level:
    com.gsr.onboarding: INFO

app:
  integrations:
    openai: ${OPENAI_MODE:mock}
    email: ${EMAIL_MODE:mock}
    github: ${GITHUB_MODE:mock}
  workflow:
    email-approval-required: ${APP_WORKFLOW_EMAIL_APPROVAL_REQUIRED:false}
    github-after-email: ${APP_WORKFLOW_GITHUB_AFTER_EMAIL:true}
    max-attempts: ${APP_WORKFLOW_MAX_ATTEMPTS:5}
    poll-interval-ms: ${APP_WORKFLOW_POLL_INTERVAL_MS:2000}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    timeout-seconds: 30
    fallback-enabled: ${OPENAI_FALLBACK_ENABLED:true}
    fallback-template: ${OPENAI_FALLBACK_TEMPLATE:classpath:templates/fallback-welcome.txt}
    company-name: ${COMPANY_NAME:Acme Corp}
    system-prompt: >-
      You are an HR onboarding assistant for {company}. Write professional, warm and concise onboarding content.
      Use only the employee facts provided. Do not invent policies, salaries, benefits, links, phone numbers or people.
      The welcome email body must be plain text (no HTML, no markdown), at most 250 words, addressed to the employee by first name,
      and signed by "The {company} People Team". The checklist must contain 5 to 10 short, actionable items relevant to the
      employee's role and department. The GitHub issue summary must be plain markdown prose without @mentions, links or code blocks.
  mail:
    from: ${MAIL_FROM:onboarding@example.com}
    from-name: ${MAIL_FROM_NAME:Onboarding Team}
  github:
    token: ${GITHUB_TOKEN:}
    api-url: ${GITHUB_API_URL:https://api.github.com}
    default-owner: ${GITHUB_DEFAULT_OWNER:acme-corp}
    default-repository: ${GITHUB_DEFAULT_REPOSITORY:onboarding}
    timeout-seconds: 15
    labels:
      - onboarding
  security:
    hr-username: ${APP_HR_USERNAME:hr}
    hr-password: ${APP_HR_PASSWORD:hr-password}
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin-password}
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  mock:
    openai-fail: ${APP_MOCK_OPENAI_FAIL:false}
    email-fail: ${APP_MOCK_EMAIL_FAIL:false}
    github-fail: ${APP_MOCK_GITHUB_FAIL:false}
